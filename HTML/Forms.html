<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
  </head>
  <body>
    <section>
      <h2>1. Login Form</h2>
      <form>
        <div class="form-group">
          <label>Username:</label>
          <input type="text" name="username" />
        </div>
        <div class="form-group">
          <label>Password:</label>
          <input type="password" name="password" />
        </div>
        <button type="submit">Submit</button>
      </form>
    </section>

    <section>
      <h2>2.Registration Form</h2>
      <form>
        <div class="form-group">
          <label>First name:</label>
          <input type="text" name="firstname" />
        </div>
        <div class="form-group">
          <label>Last name:</label>
          <input type="text" name="lastname" />
        </div>
        <div class="form-group">
          <label>Email:</label>
          <input type="email" name="email" />
        </div>
        <div class="form-group">
          <label>Password:</label>
          <input type="password" name="password" />
        </div>
        <button type="submit">Login!</button>
      </form>
    </section>

    <section>
      <h2>3. Registration Form</h2>
      <form>
        <div class="form-group">
          <label>First Name:</label>
          <input type="text" placeholder="Enter First Name" />
        </div>
        <div class="form-group">
          <label>Last Name:</label>
          <input type="text" placeholder="Enter Last Name" />
        </div>
        <div class="form-group">
          <label>Email:</label>
          <input type="email" placeholder="Enter Email Address" />
        </div>
        <div class="form-group">
          <label>Password:</label>
          <input type="password" />
        </div>

        <div class="form-group">
          <strong>Gender:</strong><br />
          <input type="radio" name="gender" value="male" /> Male <br />
          <input type="radio" name="gender" value="female" /> Female <br />
          <input type="radio" name="gender" value="other" /> Other
        </div>

        <div class="form-group">
          <label>Age:</label>
          <input type="number" min="1" max="100" />
        </div>

        <div class="form-group">
          <strong>Preferences:</strong><br />
          <input type="checkbox" /> Acrylic Painting <br />
          <input type="checkbox" /> Oil Painting <br />
          <input type="checkbox" /> Water Color Painting
        </div>

        <div class="form-group">
          <label>Select Occupation:</label>
          <select>
            <option>Student</option>
            <option>Teacher</option>
            <option>Professional</option>
          </select>
        </div>

        <div class="form-group">
          <label>Bio:</label><br />
          <textarea
            rows="4"
            placeholder="Share few lines about yourself..."
          ></textarea>
        </div>

        <button type="reset">RESET</button>
        <button type="submit">SUBMIT</button>
      </form>
    </section>
  </body>
</html>
