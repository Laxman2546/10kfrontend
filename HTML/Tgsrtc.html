<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TGSRTC Application Header</title>
  </head>
  <body
    style="
      font-family: Arial, sans-serif;
      background-color: #f0f4f8;
      padding: 20px;
    "
  >
    <div
      style="
        background-color: #e8ebff;
        max-width: 800px;
        margin: 0 auto;
        padding: 20px;
        border-radius: 30px;
        text-align: center;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      "
    >
      <div style="margin-bottom: 10px">
        <div
          style="
            width: 50px;
            height: 50px;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 50%;
            display: inline-block;
            line-height: 50px;
            font-size: 10px;
            color: #666;
          "
        >
          <img
            src="https://tgsrtcpass.com/images/Tsrtc_new_logo.jpg"
            alt="TGSRTC Logo"
            style="width: 50px; height: 50px"
          />
        </div>
      </div>

      <h1
        style="
          color: #0000ff;
          font-size: 22px;
          margin: 5px 0;
          text-transform: uppercase;
          letter-spacing: 1px;
        "
      >
        TELANGANA STATE ROAD TRANSPORT CORPORATION
      </h1>

      <h2
        style="
          color: #000000;
          font-size: 18px;
          margin: 10px 0 5px 0;
          text-transform: uppercase;
          font-weight: bold;
        "
      >
        GENERAL BUS PASS APPLICATION
      </h2>
    </div>
  </body>
</html>
