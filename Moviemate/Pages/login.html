<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login</title>
    <link rel="stylesheet" href="/styles/Style.css" />
    <link rel="stylesheet" href="/styles/login.css" />
  </head>
  <body>
    <div class="container">
      <div class="poster">
        <img
          src="https://m.media-amazon.com/images/M/MV5BNmIwYTI3ODItMzRkOS00MzlhLWI4NzQtNDFmOGJhZGJhM2VkXkEyXkFqcGc@._V1_.jpg"
          alt="Login Image"
          class="login-image"
        />
      </div>
      <div>
        <h1>Welcome back!</h1>
        <form action="/login" method="post">
          <div class="input-group">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              class="input-field"
              placeholder="Enter your username"
              required
            />
          </div>
          <div class="input-group input2">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              class="input-field"
              name="password"
              placeholder="Enter your password"
              required
            />
            <div
              class="toggle-password-container"
              onclick="togglePasswordVisibility()"
            >
              <img
                src="https://cdn-icons-png.flaticon.com/512/159/159604.png"
                alt="Show Password"
                id="togglePassword"
                class="toggle-password"
              />
            </div>
          </div>
          <button type="submit">Login</button>
          <p class="noaccount">
            Don't have an account?
            <a class="signup-link" href="/Pages/register.html"> Sign up</a>
          </p>
        </form>
      </div>
    </div>
    <script>
     
    </script>

    <script src="/scripts/login.js"></script>
  </body>
</html>
