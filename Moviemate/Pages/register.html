<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="stylesheet" href="/styles/Style.css" />
    <link rel="stylesheet" href="/styles/register.css" />
  </head>
  <body>
    <div class="container">
      <div>
        <h1>It's All Start here</h1>
        <form action="/register" method="post">
          <div class="input-group">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              class="input-field"
              placeholder="Enter your username"
              required
            />
          </div>
          <div class="input-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              class="input-field input2"
              name="password"
              placeholder="Enter your password"
              required
            />
          </div>
          <div class="input-group">
            <label for="confirm-password">Confirm Password</label>
            <input
              type="password"
              id="confirm-password"
              class="input-field input2"
              name="confirm-password"
              placeholder="Confirm your password"
              required
            />
          </div>

          <button type="submit">Register</button>
          <p class="noaccount">
            Already have an account?
            <a class="signup-link" href="/Pages/login.html"> Log in</a>
          </p>
        </form>
      </div>
      <div class="poster">
        <img
          src="https://m.media-amazon.com/images/M/MV5BMjZmZGMyYjgtMGU2Mi00ZGE1LTkwYjEtYzdkYTA0ODI0MDI2XkEyXkFqcGc@._V1_.jpg"
          alt="Register Image"
          class="login-image"
        />
      </div>
    </div>
  </body>
</html>
