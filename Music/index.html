<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MusicTask</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="songdetails">
        <div class="image">
          <img
            class="dookudu"
            src="https://cinemachaat.com/wp-content/uploads/2011/09/dookudu-poster-mahesh.jpg"
          />
          <label for="pause">
            <div class="lines">
              <div class="musicline musicline1"></div>
              <div class="musicline musicline2"></div>
              <div class="musicline musicline3"></div>
              <div class="musicline musicline4"></div>
              <div class="musicline musicline1"></div>
              <div class="musicline musicline2"></div>
              <div class="musicline musicline3"></div>
              <div class="musicline musicline4"></div>
            </div>
          </label>
        </div>
        <div class="details">
          <div class="movietitle">
            <h2>Guruvaram</h2>
          </div>
          <div class="singer">
            <h3>Rahul Nambiar</h3>
          </div>
        </div>
      </div>
      <div class="controls">
        <svg
          stroke="currentColor"
          fill="currentColor"
          stroke-width="0"
          viewBox="0 0 320 512"
          class="text-white/80 cursor-pointer hover:text-white transition-transform hover:scale-110"
          height="20"
          width="20"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M267.5 440.6c9.5 7.9 22.8 9.7 34.1 4.4s18.4-16.6 18.4-29l0-320c0-12.4-7.2-23.7-18.4-29s-24.5-3.6-34.1 4.4l-192 160L64 241 64 96c0-17.7-14.3-32-32-32S0 78.3 0 96L0 416c0 17.7 14.3 32 32 32s32-14.3 32-32l0-145 11.5 9.6 192 160z"
          ></path>
        </svg>
          <img
            width="25"
            height="25"
            src="https://img.icons8.com/material-rounded/48/FAFAFA/pause.png"
            alt="pause"
            class="pause"
          />
        </label>
        <svg
          stroke="currentColor"
          fill="currentColor"
          stroke-width="0"
          viewBox="0 0 320 512"
          class="text-white/80 cursor-pointer hover:text-white transition-transform hover:scale-110"
          height="20"
          width="20"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M52.5 440.6c-9.5 7.9-22.8 9.7-34.1 4.4S0 428.4 0 416L0 96C0 83.6 7.2 72.3 18.4 67s24.5-3.6 34.1 4.4l192 160L256 241l0-145c0-17.7 14.3-32 32-32s32 14.3 32 32l0 320c0 17.7-14.3 32-32 32s-32-14.3-32-32l0-145-11.5 9.6-192 160z"
          ></path>
        </svg>
      </div>
    </div>
  </body>
</html>
