<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Javaline theme architect demo</title>
    <link rel="icon" href="./fav.png" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./Projects.css" />
    <link rel="stylesheet" href="./form.css" />
  </head>
  <body>
    <header class="headnav">
      <nav class="navbar">
        <div class="left">
          <img
            src="https://jevelin.shufflehound.com/architect/wp-content/uploads/sites/30/2019/03/Jevelin_logo.png"
            alt="Javaline logo"
          />
        </div>
        <div class="right">
          <input
            type="checkbox"
            id="hamburger-checkbox"
            style="display: none"
          />
          <label for="hamburger-checkbox" class="hamburger">
            <span class="hamline"></span>
            <span class="hamline"></span>
            <span class="hamline"></span>
          </label>
          <ul class="navitems">
            <a href="index.html" style="font-weight: normal" class="items"
              >Home</a
            >
            <a href="Projects.html" class="items">Projects</a>
            <a href="News.html" class="items">News</a>
            <a style="font-weight: bold" href="contact.html" class="items"
              >Contact</a
            >
          </ul>
        </div>
      </nav>
    </header>
    <main>
      <div class="container">
        <div class="projectContainer">
          <h1>Projects</h1>
          <div class="links">
            <a href="index.html" style="font-weight: 200; cursor: pointer"
              >Home</a
            >
            <span> > Contacts</span>
          </div>
        </div>
        <div class="form">
          <div class="surName">
            <div class="inputField">
              <div class="labelCheck">
                <label>Name</label>
                <img
                  width="20"
                  height="20"
                  src="https://img.icons8.com/pastel-glyph/128/ff0000/checked--v1.png"
                  alt="checked--v1"
                />
              </div>
              <input type="text" />
            </div>
            <div class="inputField">
              <div class="labelCheck">
                <label>Surname</label>
                <img
                  width="20"
                  height="20"
                  src="https://img.icons8.com/pastel-glyph/128/ff0000/checked--v1.png"
                  alt="checked--v1"
                />
              </div>
              <input type="text" />
            </div>
          </div>
          <div class="inputField">
            <div class="labelCheck">
              <label>Emali</label>
              <img
                width="20"
                height="20"
                src="https://img.icons8.com/pastel-glyph/128/ff0000/checked--v1.png"
                alt="checked--v1"
              />
            </div>
            <input type="text" />
          </div>
          <div class="inputField">
            <div class="labelCheck">
              <label>Message</label>
              <img
                width="20"
                height="20"
                src="https://img.icons8.com/pastel-glyph/128/ff0000/checked--v1.png"
                alt="checked--v1"
              />
            </div>
            <textarea></textarea>
          </div>
          <div class="btn">
            <button class="submitBtn">Submit</button>
          </div>
        </div>
        <div class="footer">
          <div class="footertop">
            <div class="logodet">
              <img
                src="https://jevelin.shufflehound.com/architect/wp-content/uploads/sites/30/2019/03/Jevelin_logo_light.png"
                alt="Javaline logo"
              />
            </div>

            <ul class="links">
              <li>Home</li>
              <li>Projects</li>
              <li>News</li>
              <li>Contact</li>
            </ul>

            <div class="social">
              <img
                width="24"
                height="24"
                src="https://img.icons8.com/material-outlined/24/F4F5F0/linkedin--v1.png"
                alt="linkedin--v1"
              />
              <img
                width="24"
                height="24"
                src="https://img.icons8.com/ios-glyphs/30/F4F5F0/twitter--v1.png"
                alt="twitter--v1"
              />
              <img
                width="24"
                height="24"
                src="https://img.icons8.com/ios-filled/20/F4F5F0/facebook-new.png"
                alt="facebook-new"
              />
              <img
                width="24"
                height="24"
                src="https://img.icons8.com/windows/32/F4F5F0/instagram-new.png"
                alt="instagram-new"
              />
            </div>
          </div>
          <span class="line"></span>
          <div class="footerbottom">
            <p>Copyright © JevelinTheme - Theme by Lakshman</p>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
